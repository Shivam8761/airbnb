spring.application.name=staysphere-test

# In-Memory H2 Database for Testing
spring.datasource.url=jdbc:h2:mem:staysphere_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# API base path
server.servlet.context-path=/api/v1

# Security / JWT secret for test context
jwt.secretKey=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# Frontend URL
frontend.url=http://localhost:3000

